name: UI Quality Gates

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/ui/**"
      - "packages/config/**"
      - "apps/*/src/**/*.tsx"
      - "apps/*/src/**/*.ts"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/ui/**"
      - "packages/config/**"
      - "apps/*/src/**/*.tsx"
      - "apps/*/src/**/*.ts"

jobs:
  color-compliance:
    name: Color System Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Check for hardcoded hex colors
        run: |
          echo "Checking for hardcoded hex colors..."
          VIOLATIONS=$(grep -rn "#[0-9A-Fa-f]\{3,8\}\b" packages/ui/src \
            --include="*.tsx" --include="*.ts" --include="*.css" \
            | grep -v "design-system/tokens" \
            | grep -v "node_modules" \
            | grep -v "\.test\." \
            | grep -v "\.stories\." \
            | wc -l)
          
          if [ "$VIOLATIONS" -gt 50 ]; then
            echo "Found $VIOLATIONS hardcoded color values (threshold: 50):"
            grep -rn "#[0-9A-Fa-f]\{3,8\}\b" packages/ui/src \
              --include="*.tsx" --include="*.ts" --include="*.css" \
              | grep -v "design-system/tokens" \
              | grep -v "node_modules" \
              | head -20
            exit 1
          fi
          echo "Color compliance check passed ($VIOLATIONS violations, threshold: 50)"
      
      - name: Check for non-grayscale Tailwind classes
        run: |
          echo "Checking for non-grayscale Tailwind classes..."
          VIOLATIONS=$(grep -rn -E "(bg|text|border|ring|fill|stroke)-(red|blue|green|orange|purple|pink|yellow|cyan|teal|indigo|violet|amber|lime|emerald|rose|fuchsia|sky)-" packages/ui/src \
            --include="*.tsx" --include="*.ts" \
            | grep -v "\.test\." \
            | grep -v "\.stories\." \
            | wc -l)
          
          if [ "$VIOLATIONS" -gt 20 ]; then
            echo "Found $VIOLATIONS non-grayscale Tailwind classes (threshold: 20):"
            grep -rn -E "(bg|text|border|ring|fill|stroke)-(red|blue|green|orange|purple|pink|yellow|cyan|teal|indigo|violet|amber|lime|emerald|rose|fuchsia|sky)-" packages/ui/src \
              --include="*.tsx" --include="*.ts" \
              | head -20
            exit 1
          fi
          echo "Tailwind compliance check passed ($VIOLATIONS violations, threshold: 20)"

  typescript-check:
    name: TypeScript Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: TypeScript Check - UI Package
        run: cd packages/ui && pnpm tsc --noEmit
      
      - name: TypeScript Check - Config Package
        run: cd packages/config && pnpm tsc --noEmit

  lint-check:
    name: ESLint Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: ESLint - UI Package
        run: pnpm turbo lint --filter=@ghxstship/ui
      
      - name: ESLint - Config Package
        run: pnpm turbo lint --filter=@repo/config

  build-check:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [typescript-check, lint-check]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build UI Package
        run: pnpm turbo build --filter=@ghxstship/ui
      
      - name: Build Config Package
        run: pnpm turbo build --filter=@repo/config
